<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Layout</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        /* Navigation Bar Styles */
        .navbar {
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .navbar .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .navbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .navbar li {
            margin-left: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .navbar a:hover {
            color: #4CAF50; /* Green highlight on hover */
        }

        /* Image Row Styles */
        .image-row {
            display: flex;
            justify-content: space-between;
            gap: 20px; /* Space between images */
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto; /* Centers the row layout */
        }

        .image-container {
            flex: 1; /* Makes all 3 columns share equal width */
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 8px; /* Slightly rounds the image corners */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Soft shadow beneath images */
            display: block;
        }

        /* Responsive Design for smaller screens */
        @media (max-width: 768px) {
            .image-row {
                flex-direction: column; /* Stack images vertically on phones */
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Upper Row of 3 Images -->
    <div class="image-row">
        <div class="image-container">
            <!-- Replace the placeholder URL with your local css/image1.jpg path if preferred -->
            <img src="https://telugucinema.com/wp-content/uploads/2025/12/vijaylastspeech.jpg" alt="Image 1">
        </div>
        <div class="image-container">
            <img src="https://telugucinema.com/wp-content/uploads/2025/03/theparadise-story.jpg" alt="Image 2">
        </div>
        <div class="image-container">
            <img src="https://telugucinema.com/wp-content/uploads/2026/09/yashfamily-sep2426.jpg" alt="Image 3">
        </div>
    </div>

</body>
</html>
